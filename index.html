<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio de Boni Koman, développeur web full-stack et étudiant WebTech." />
  <title>Boni Koman | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --ink: #101522;
      --muted: #667085;
      --line: rgba(16, 21, 34, .12);
      --paper: #f7f4ec;
      --panel: rgba(255, 255, 255, .76);
      --night: #121726;
      --blue: #2563eb;
      --green: #0f9f6e;
      --coral: #f05252;
      --gold: #d97706;
      --cyan: #0891b2;
      --shadow: 0 24px 80px rgba(16, 21, 34, .13);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      letter-spacing: 0;
    }

    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .site-shell {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 10%, rgba(37, 99, 235, .15), transparent 28rem),
        radial-gradient(circle at 10% 42%, rgba(15, 159, 110, .16), transparent 24rem),
        linear-gradient(180deg, #f8f5ef 0%, #eef7f4 44%, #f8f5ef 100%);
    }

    .nav {
      position: fixed;
      inset: 16px 18px auto;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 10px 10px 10px 18px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 999px;
      background: rgba(255, 255, 255, .73);
      box-shadow: 0 14px 50px rgba(16, 21, 34, .12);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 900;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff;
      background: conic-gradient(from 220deg, var(--blue), var(--green), var(--gold), var(--coral), var(--blue));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.42);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .nav-links a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .nav-links a:hover {
      color: var(--ink);
      background: rgba(16, 21, 34, .07);
      transform: translateY(-1px);
    }

    .nav-links a.active {
      color: #fff;
      background: var(--ink);
      box-shadow: 0 10px 26px rgba(16, 21, 34, .16);
    }

    .menu-button {
      display: none;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
    }

    .hero {
      position: relative;
      min-height: 92vh;
      display: grid;
      align-items: center;
      padding: 118px 22px 64px;
      isolation: isolate;
    }

    .view-page {
      display: none;
    }

    .view-page.active {
      display: block;
      animation: pageIn .42s ease both;
    }

    .hero.view-page.active {
      display: grid;
    }

    .content-page {
      min-height: calc(100vh - 80px);
      padding-top: 124px;
      padding-bottom: 72px;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #three-hero {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      opacity: .84;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(248,245,239,.98) 0%, rgba(248,245,239,.86) 47%, rgba(248,245,239,.36) 100%);
    }

    .container {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 50px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      color: #475467;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .signal {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(15, 159, 110, .15);
    }

    .hero h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(54px, 9vw, 118px);
      line-height: .9;
      font-weight: 900;
      letter-spacing: 0;
    }

    .hero h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, var(--ink), #1d4ed8 46%, #047857 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .hero-copy {
      max-width: 660px;
      margin: 26px 0 0;
      color: #344054;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.45;
      font-weight: 600;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-weight: 900;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .btn-primary {
      color: white;
      background: var(--ink);
      box-shadow: 0 16px 36px rgba(16, 21, 34, .2);
    }

    .btn-soft {
      color: var(--ink);
      background: rgba(255,255,255,.72);
      border-color: rgba(16, 21, 34, .12);
    }

    .btn:hover { transform: translateY(-2px); }
    .icon { width: 18px; height: 18px; stroke-width: 2.4; }

    .portrait-wrap {
      position: relative;
      justify-self: end;
      width: min(360px, 100%);
      aspect-ratio: 4 / 5;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.6);
      background: #d8e7e2;
      box-shadow: var(--shadow);
      transform: rotate(1.2deg);
    }

    .portrait-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .portrait-tag {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 48px;
      padding: 8px 12px;
      border-radius: 8px;
      color: #fff;
      background: rgba(16, 21, 34, .78);
      backdrop-filter: blur(14px);
      font-size: 13px;
      font-weight: 800;
    }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      margin-top: 54px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--line);
      box-shadow: 0 20px 60px rgba(16, 21, 34, .08);
    }

    .stat {
      min-height: 106px;
      padding: 22px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(14px);
    }

    .stat strong {
      display: block;
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    section:not(.content-page) {
      padding: 90px 0;
      scroll-margin-top: 98px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 34px;
    }

    .section-kicker {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .section-title {
      max-width: 760px;
      margin: 0;
      font-size: clamp(34px, 5vw, 62px);
      line-height: .98;
      font-weight: 900;
      letter-spacing: 0;
    }

    .section-copy {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-weight: 600;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 22px;
      align-items: stretch;
    }

    .glass-panel {
      border: 1px solid rgba(255,255,255,.66);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .about-story {
      padding: clamp(24px, 4vw, 42px);
    }

    .about-story p {
      margin: 0 0 18px;
      color: #344054;
      font-size: 18px;
      line-height: 1.75;
      font-weight: 600;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(16, 21, 34, .1);
      border-radius: 999px;
      background: rgba(255,255,255,.58);
      color: #344054;
      font-size: 13px;
      font-weight: 800;
    }

    .activity-list {
      display: grid;
      gap: 12px;
      padding: 18px;
    }

    .activity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.66);
      font-weight: 800;
    }

    .activity i {
      display: grid;
      place-items: center;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      font-style: normal;
    }

    .timeline {
      display: grid;
      gap: 18px;
    }

    .experience-item {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 24px;
      padding: 26px;
      border-left: 6px solid var(--accent);
    }

    .date {
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
    }

    .experience-item h3 {
      margin: 0 0 6px;
      font-size: 25px;
      line-height: 1.15;
    }

    .role {
      margin: 0 0 14px;
      color: #475467;
      font-weight: 900;
    }

    .experience-item p {
      margin: 0;
      color: #475467;
      line-height: 1.65;
      font-weight: 600;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      min-height: 456px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 8px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 18px 60px rgba(16, 21, 34, .1);
      transition: transform .24s ease, box-shadow .24s ease;
    }

    .project-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 28px 80px rgba(16, 21, 34, .16);
    }

    .project-image {
      height: 210px;
      background: #d9e5df;
      overflow: hidden;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .55s ease;
    }

    .project-card:hover .project-image img { transform: scale(1.06); }

    .project-body {
      padding: 21px;
    }

    .project-body h3 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .project-body p {
      min-height: 92px;
      margin: 0;
      color: #526174;
      line-height: 1.55;
      font-size: 14px;
      font-weight: 600;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .tag {
      padding: 7px 9px;
      border-radius: 8px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, white);
      font-size: 12px;
      font-weight: 900;
    }

    .skills-layout {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 22px;
      align-items: start;
    }

    .skill-radar {
      position: relative;
      min-height: 420px;
      padding: 30px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .orbit {
      position: absolute;
      border: 1px dashed rgba(16, 21, 34, .15);
      border-radius: 50%;
      animation: spin 24s linear infinite;
    }

    .orbit.one { width: 300px; height: 300px; }
    .orbit.two { width: 220px; height: 220px; animation-duration: 18s; animation-direction: reverse; }
    .orbit.three { width: 140px; height: 140px; animation-duration: 13s; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .radar-core {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, var(--ink), #1d4ed8 54%, #047857);
      box-shadow: 0 28px 80px rgba(37, 99, 235, .25);
      font-weight: 900;
    }

    .skill-bars {
      display: grid;
      gap: 15px;
      padding: 26px;
    }

    .skill-line {
      display: grid;
      gap: 9px;
    }

    .skill-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-weight: 900;
    }

    .bar {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(16, 21, 34, .09);
    }

    .bar span {
      display: block;
      width: var(--level);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #101522);
      transform-origin: left;
      animation: grow 1.2s ease both;
    }

    @keyframes grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .travel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .travel-card {
      min-height: 360px;
      overflow: hidden;
      border-radius: 8px;
      background: var(--night);
      color: #fff;
    }

    .travel-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      opacity: .9;
    }

    .travel-card div { padding: 22px; }
    .travel-card h3 { margin: 0 0 8px; font-size: 24px; }
    .travel-card p { margin: 0; color: rgba(255,255,255,.76); line-height: 1.6; font-weight: 600; }

    .contact-panel {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 24px;
      padding: clamp(24px, 4vw, 42px);
      background: #101522;
      color: #fff;
    }

    .contact-panel h2 {
      margin: 0 0 16px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: .98;
      letter-spacing: 0;
    }

    .contact-panel p {
      margin: 0;
      color: rgba(255,255,255,.72);
      line-height: 1.7;
      font-weight: 600;
    }

    .contact-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-content: start;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 82px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(255,255,255,.07);
      font-weight: 900;
      transition: background .2s ease, transform .2s ease;
      min-width: 0;
    }

    .contact-link:hover {
      background: rgba(255,255,255,.12);
      transform: translateY(-2px);
    }

    .contact-link small {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.62);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 30px 0 50px;
      color: #667085;
      text-align: center;
      font-weight: 700;
    }

    [data-reveal] {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .65s ease, transform .65s ease;
    }

    [data-reveal].visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 940px) {
      .nav { border-radius: 24px; }
      .menu-button { display: inline-flex; }
      .nav-links {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        display: none;
        width: min(320px, calc(100vw - 36px));
        padding: 10px;
        border: 1px solid rgba(255,255,255,.58);
        border-radius: 8px;
        background: rgba(255,255,255,.94);
        box-shadow: var(--shadow);
      }
      .nav-links.open { display: grid; }
      .nav-links a { justify-content: flex-start; }
      .hero-grid, .about-grid, .skills-layout, .contact-panel { grid-template-columns: 1fr; }
      .portrait-wrap { justify-self: start; width: min(320px, 100%); }
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .projects-grid, .travel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .experience-item { grid-template-columns: 1fr; }
      .section-head { align-items: start; flex-direction: column; }
    }

    @media (max-width: 640px) {
      .container { width: min(100% - 28px, 1180px); }
      .hero { min-height: auto; padding-top: 108px; }
      .hero::after { background: rgba(248,245,239,.88); }
      .hero-actions .btn { width: 100%; }
      .stats-strip, .projects-grid, .travel-grid, .contact-links { grid-template-columns: 1fr; }
      .stat { min-height: auto; }
      section { padding: 68px 0; }
      .project-body p { min-height: auto; }
      .contact-link { min-height: 74px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.165.0";

    const canvas = document.getElementById("three-hero");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    const group = new THREE.Group();
    const pointer = new THREE.Vector2(0, 0);
    let width = 1;
    let height = 1;

    camera.position.set(0, 0, 9);
    scene.add(group);

    const palette = [0x2563eb, 0x0f9f6e, 0xd97706, 0xf05252, 0x0891b2, 0x101522];
    const shapes = [
      new THREE.IcosahedronGeometry(.58, 1),
      new THREE.OctahedronGeometry(.55, 0),
      new THREE.TorusKnotGeometry(.34, .11, 90, 12),
      new THREE.BoxGeometry(.7, .7, .7)
    ];

    for (let i = 0; i < 42; i += 1) {
      const material = new THREE.MeshStandardMaterial({
        color: palette[i % palette.length],
        roughness: .42,
        metalness: .18,
        transparent: true,
        opacity: .78
      });
      const mesh = new THREE.Mesh(shapes[i % shapes.length], material);
      const radius = 2.4 + Math.random() * 3.2;
      const angle = Math.random() * Math.PI * 2;
      mesh.position.set(Math.cos(angle) * radius + 1.8, (Math.random() - .5) * 5.6, Math.sin(angle) * 1.3);
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      mesh.scale.setScalar(.55 + Math.random() * .9);
      mesh.userData = { speed: .25 + Math.random() * .7, drift: Math.random() * Math.PI * 2 };
      group.add(mesh);
    }

    const heroRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.4, .018, 16, 160),
      new THREE.MeshBasicMaterial({ color: 0x101522, transparent: true, opacity: .2 })
    );
    heroRing.position.set(2.5, .1, -1.2);
    heroRing.rotation.set(1.1, .3, .2);
    group.add(heroRing);

    scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(3, 5, 6);
    scene.add(key);

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(1, rect.width);
      height = Math.max(1, rect.height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", (event) => {
      pointer.x = (event.clientX / window.innerWidth - .5) * 2;
      pointer.y = (event.clientY / window.innerHeight - .5) * 2;
    });

    function animate(time) {
      const t = time * .001;
      group.rotation.y += ((pointer.x * .16) - group.rotation.y) * .035;
      group.rotation.x += ((-pointer.y * .08) - group.rotation.x) * .035;
      group.children.forEach((child, index) => {
        child.rotation.x += .003 * (child.userData?.speed || 1);
        child.rotation.y += .004 * (child.userData?.speed || 1);
        child.position.y += Math.sin(t + (child.userData?.drift || 0)) * .0018;
        if (index % 5 === 0) child.position.x += Math.cos(t * .45 + index) * .0015;
      });
      heroRing.rotation.z = t * .08;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    resize();
    requestAnimationFrame(animate);
  </script>
